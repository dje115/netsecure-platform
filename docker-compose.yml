version: '3.8'

services:
  # PostgreSQL Database
  security-db:
    image: postgres:15-alpine
    container_name: security-db
    environment:
      POSTGRES_DB: security_platform
      POSTGRES_USER: security_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - security-network
    restart: unless-stopped

  # FastAPI Backend
  security-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-api
    environment:
      DATABASE_URL: postgresql://security_admin:${DB_PASSWORD:-change_me_in_production}@security-db:5432/security_platform
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      WSL_SCANNER_HOST: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - scan-results:/app/scan_results
    depends_on:
      - security-db
    networks:
      - security-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  security-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - security-api
    networks:
      - security-network
    restart: unless-stopped

  # Redis for task queue
  redis:
    image: redis:7-alpine
    container_name: security-redis
    ports:
      - "6379:6379"
    networks:
      - security-network
    restart: unless-stopped

  # Celery worker for background tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-celery
    environment:
      DATABASE_URL: postgresql://security_admin:${DB_PASSWORD:-change_me_in_production}@security-db:5432/security_platform
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WSL_SCANNER_HOST: host.docker.internal
    volumes:
      - ./backend:/app
      - scan-results:/app/scan_results
    depends_on:
      - security-db
      - redis
    networks:
      - security-network
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info

networks:
  security-network:
    driver: bridge

volumes:
  postgres-data:
  scan-results:
