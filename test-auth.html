<!DOCTYPE html>
<html>
<head>
    <title>Test Auth</title>
</head>
<body>
    <h1>Test Authentication</h1>
    
    <div>
        <h2>Register</h2>
        <input type="text" id="reg_username" placeholder="Username"><br>
        <input type="email" id="reg_email" placeholder="Email"><br>
        <input type="password" id="reg_password" placeholder="Password"><br>
        <button onclick="register()">Register</button>
    </div>
    
    <hr>
    
    <div>
        <h2>Login</h2>
        <input type="text" id="login_username" placeholder="Username" value="admin"><br>
        <input type="password" id="login_password" placeholder="Password" value="admin123"><br>
        <button onclick="login()">Login</button>
    </div>
    
    <hr>
    
    <div>
        <h2>Test Scans</h2>
        <button onclick="getScans()">Get Scans</button>
        <button onclick="createScan()">Create Test Scan</button>
    </div>
    
    <hr>
    
    <div id="output" style="white-space: pre-wrap; font-family: monospace; background: #f0f0f0; padding: 10px;"></div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        function log(message) {
            document.getElementById('output').innerHTML += message + '\n';
        }
        
        async function register() {
            const username = document.getElementById('reg_username').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                log('Register: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                log('Register Error: ' + error);
            }
        }
        
        async function login() {
            const username = document.getElementById('login_username').value;
            const password = document.getElementById('login_password').value;
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                log('Login: ' + JSON.stringify(data, null, 2));
                
                if (data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    log('Token saved to localStorage');
                }
            } catch (error) {
                log('Login Error: ' + error);
            }
        }
        
        async function getScans() {
            const token = localStorage.getItem('token');
            log('Token from localStorage: ' + (token ? token.substring(0, 20) + '...' : 'NONE'));
            
            try {
                const response = await fetch(`${API_URL}/api/scans/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                log('Get Scans Status: ' + response.status);
                const data = await response.json();
                log('Get Scans: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                log('Get Scans Error: ' + error);
            }
        }
        
        async function createScan() {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_URL}/api/scans/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: 'Test Scan',
                        target_range: '192.168.22.1',
                        scan_type: 'quick'
                    })
                });
                
                log('Create Scan Status: ' + response.status);
                const data = await response.json();
                log('Create Scan: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                log('Create Scan Error: ' + error);
            }
        }
    </script>
</body>
</html>
